name: aidlink

services:
  postgres:
    image: postgres:17.11-alpine
    container_name: aidlink-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-aidlink}
      POSTGRES_USER: ${POSTGRES_USER:-aidlink}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-aidlink_dev}
      TZ: Asia/Seoul
    ports:
      - "${POSTGRES_HOST_PORT:-5433}:5432"
    volumes:
      - aidlink-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:8.6.6-alpine
    container_name: aidlink-redis
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  backend:
    build:
      context: ./backend
    image: aidlink/backend:local
    container_name: aidlink-backend
    environment:
      SPRING_PROFILES_ACTIVE: postgres
      AIDLINK_DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-aidlink}
      AIDLINK_DB_USERNAME: ${POSTGRES_USER:-aidlink}
      AIDLINK_DB_PASSWORD: ${POSTGRES_PASSWORD:-aidlink_dev}
      AIDLINK_REDIS_ENABLED: "true"
      AIDLINK_REDIS_HOST: redis
      AIDLINK_REDIS_PORT: "6379"
      AIDLINK_OTLP_TRACING_ENABLED: "true"
      AIDLINK_OTLP_TRACING_ENDPOINT: http://tempo:4318/v1/traces
      AIDLINK_TRACE_SAMPLE_RATE: ${AIDLINK_TRACE_SAMPLE_RATE:-0.1}
      AIDLINK_ENVIRONMENT: ${AIDLINK_ENVIRONMENT:-local-compose}
      AIDLINK_SECURE_COOKIE: ${AIDLINK_SECURE_COOKIE:-false}
      AIDLINK_CORS_ALLOWED_ORIGINS: ${AIDLINK_CORS_ALLOWED_ORIGINS:-http://localhost:3000}
      AIDLINK_BOOTSTRAP_ADMIN_ENABLED: ${AIDLINK_BOOTSTRAP_ADMIN_ENABLED:-false}
      AIDLINK_BOOTSTRAP_ADMIN_EMAIL: ${AIDLINK_BOOTSTRAP_ADMIN_EMAIL:-}
      AIDLINK_BOOTSTRAP_ADMIN_PASSWORD: ${AIDLINK_BOOTSTRAP_ADMIN_PASSWORD:-}
      AIDLINK_GOV24_SERVICE_KEY: ${AIDLINK_GOV24_SERVICE_KEY:-}
      AIDLINK_GOV24_SCHEDULING_ENABLED: ${AIDLINK_GOV24_SCHEDULING_ENABLED:-false}
      AIDLINK_GOV24_CRON: "${AIDLINK_GOV24_CRON:-0 0 3 * * *}"
      AIDLINK_GOV24_SOURCE_REMOVED_THRESHOLD: ${AIDLINK_GOV24_SOURCE_REMOVED_THRESHOLD:-3}
      AIDLINK_OPENAI_ENABLED: ${AIDLINK_OPENAI_ENABLED:-false}
      AIDLINK_OPENAI_API_KEY: ${AIDLINK_OPENAI_API_KEY:-}
      AIDLINK_OPENAI_MODEL: ${AIDLINK_OPENAI_MODEL:-gpt-5.6-terra}
      AIDLINK_AI_INPUT_USD_PER_MILLION: ${AIDLINK_AI_INPUT_USD_PER_MILLION:-0}
      AIDLINK_AI_OUTPUT_USD_PER_MILLION: ${AIDLINK_AI_OUTPUT_USD_PER_MILLION:-0}
      AIDLINK_AI_PIPELINE_SCHEDULING_ENABLED: ${AIDLINK_AI_PIPELINE_SCHEDULING_ENABLED:-false}
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      tempo:
        condition: service_started
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8080}
    image: aidlink/frontend:local
    container_name: aidlink-frontend
    environment:
      BACKEND_API_BASE_URL: http://backend:8080
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8080}
    ports:
      - "3000:3000"
    depends_on:
      - backend
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v3.5.5
    container_name: aidlink-prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
      - --web.enable-lifecycle
    ports:
      - "${PROMETHEUS_HOST_PORT:-9091}:9090"
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./infra/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - aidlink-prometheus-data:/prometheus
    depends_on:
      - backend
    restart: unless-stopped

  loki:
    image: grafana/loki:3.7.8
    container_name: aidlink-loki
    command: ["-config.file=/etc/loki/loki.yml"]
    ports:
      - "${LOKI_HOST_PORT:-3101}:3100"
    volumes:
      - ./infra/loki/loki.yml:/etc/loki/loki.yml:ro
      - aidlink-loki-data:/loki
    restart: unless-stopped

  tempo:
    image: grafana/tempo:2.10.8
    container_name: aidlink-tempo
    command: ["-config.file=/etc/tempo/tempo.yml"]
    ports:
      - "3200:3200"
      - "4317:4317"
      - "4318:4318"
    volumes:
      - ./infra/tempo/tempo.yml:/etc/tempo/tempo.yml:ro
      - aidlink-tempo-data:/var/tempo
    restart: unless-stopped

  alloy:
    image: grafana/alloy:v1.20.1
    container_name: aidlink-alloy
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - /etc/alloy/config.alloy
    ports:
      - "12345:12345"
    volumes:
      - ./infra/alloy/config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      - loki
    restart: unless-stopped

  grafana:
    image: grafana/grafana:13.2.3
    container_name: aidlink-grafana
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-aidlink_dev}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/system.json
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
    ports:
      - "${GRAFANA_HOST_PORT:-3002}:3000"
    volumes:
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - aidlink-grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
      - loki
      - tempo
    restart: unless-stopped

volumes:
  aidlink-postgres-data:
    name: aidlink-postgres-data
  aidlink-prometheus-data:
    name: aidlink-prometheus-data
  aidlink-loki-data:
    name: aidlink-loki-data
  aidlink-tempo-data:
    name: aidlink-tempo-data
  aidlink-grafana-data:
    name: aidlink-grafana-data
