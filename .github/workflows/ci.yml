name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17.11-alpine
        env:
          POSTGRES_DB: aidlink
          POSTGRES_USER: aidlink
          POSTGRES_PASSWORD: aidlink_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U aidlink -d aidlink"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      AIDLINK_RUN_POSTGRES_TEST: "true"
      AIDLINK_LINK_DB_TEST: "true"
      AIDLINK_PERIOD_DB_TEST: "true"
      AIDLINK_DB_URL: jdbc:postgresql://localhost:5432/aidlink
      AIDLINK_DB_USERNAME: aidlink
      AIDLINK_DB_PASSWORD: aidlink_ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
      - name: Test backend
        working-directory: backend
        run: |
          chmod +x gradlew
          ./gradlew cleanTest test --no-daemon

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.21.0
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Test frontend
        working-directory: frontend
        run: npm test
      - name: Lint frontend
        working-directory: frontend
        run: npm run lint
      - name: Build frontend
        working-directory: frontend
        run: npm run build

  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Docker Compose
        run: docker compose config --quiet
