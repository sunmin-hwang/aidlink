name: Daily policy sync

on:
  workflow_dispatch:
  schedule:
    # 03:07, 06:07, 09:07 Asia/Seoul. Later runs cover delayed or failed wakes.
    - cron: "7 18,21 * * *"
    - cron: "7 0 * * *"

permissions: {}

concurrency:
  group: render-wake
  cancel-in-progress: false

jobs:
  wake:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Wake backend and wait for today's policy collection
        env:
          BACKEND_URL: ${{ vars.RENDER_BACKEND_URL }}
        run: |
          set -euo pipefail
          if [ -z "$BACKEND_URL" ]; then
            echo "Set the RENDER_BACKEND_URL repository variable first."
            exit 1
          fi
          python3 - <<'PY'
          import datetime
          import json
          import os
          import time
          import urllib.error
          import urllib.request

          base = os.environ['BACKEND_URL'].rstrip('/')
          if not base.startswith('https://'):
              raise SystemExit('RENDER_BACKEND_URL must use HTTPS')
          seoul = datetime.timezone(datetime.timedelta(hours=9))
          deadline = time.monotonic() + 25 * 60
          awake = False
          while time.monotonic() < deadline:
              path = '/api/v1/collections/gov24/status' if awake else '/actuator/health/liveness'
              try:
                  with urllib.request.urlopen(base + path, timeout=60) as response:
                      data = json.load(response)
                  if not awake:
                      awake = data.get('status') == 'UP'
                      print('Backend is awake.' if awake else 'Waiting for backend health.', flush=True)
                  else:
                      print(json.dumps(data, ensure_ascii=False), flush=True)
                      if not data.get('enabled'):
                          raise SystemExit('Enable AIDLINK_GOV24_SCHEDULING_ENABLED on Render first')
                      today = datetime.datetime.now(seoul).date().isoformat()
                      if data.get('status') == 'COMPLETED' and data.get('collectionDate') == today:
                          print('Today\'s government policy collection completed.', flush=True)
                          break
                      if data.get('status') == 'NOT_DUE':
                          print('Before the configured daily time; no collection due yet.', flush=True)
                          break
              except (urllib.error.URLError, TimeoutError, ValueError) as error:
                  # A waking Render service may return HTML with HTTP 200; JSON is required.
                  print('Waiting for backend: ' + type(error).__name__, flush=True)
              time.sleep(30)
          else:
              raise SystemExit('Daily policy collection did not complete within 25 minutes; check Render logs')
          PY
