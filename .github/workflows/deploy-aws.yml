name: Deploy AWS

on:
  workflow_run:
    workflows: [CI]
    branches: [main]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: aidlink-aws-production
  cancel-in-progress: false

jobs:
  build:
    if: >-
      vars.AWS_DEPLOY_ENABLED == 'true' &&
      ((github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
       (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.head_repository.full_name == github.repository))
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        component: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          persist-credentials: false
      - name: Image coordinates
        id: image
        env:
          COMPONENT: ${{ matrix.component }}
        run: |
          echo "name=ghcr.io/${GITHUB_REPOSITORY,,}-${COMPONENT}" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          if [ "$COMPONENT" = backend ]; then
            echo 'dockerfile=backend/Dockerfile.aws' >> "$GITHUB_OUTPUT"
          else
            echo 'dockerfile=frontend/Dockerfile' >> "$GITHUB_OUTPUT"
          fi
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish ARM image
        uses: docker/build-push-action@v6
        id: build
        with:
          context: ${{ matrix.component }}
          file: ${{ steps.image.outputs.dockerfile }}
          platforms: linux/arm64
          push: true
          tags: ${{ steps.image.outputs.name }}:${{ steps.image.outputs.sha }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          build-args: |
            NEXT_PUBLIC_API_BASE_URL=
            BACKEND_API_BASE_URL=http://backend:8080
          cache-from: type=gha,scope=aws-${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=aws-${{ matrix.component }}
      - name: Record immutable image reference
        env:
          IMAGE: ${{ steps.image.outputs.name }}
          DIGEST: ${{ steps.build.outputs.digest }}
          COMPONENT: ${{ matrix.component }}
        run: printf '%s@%s\n' "$IMAGE" "$DIGEST" > "${COMPONENT}.image"
      - uses: actions/upload-artifact@v4
        with:
          name: aws-${{ matrix.component }}-image
          path: ${{ matrix.component }}.image
          retention-days: 3

  deploy:
    needs: build
    runs-on: [self-hosted, linux, ARM64, aidlink-deploy]
    timeout-minutes: 15
    environment: production
    permissions:
      contents: read
      packages: read
      actions: read
    steps:
      - name: Set temporary registry credential directory
        run: echo "DOCKER_CONFIG=$RUNNER_TEMP/aidlink-docker-auth" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          pattern: aws-*-image
          merge-multiple: true
          path: ${{ runner.temp }}/aidlink-images
      - name: Authenticate to image registry for this job
        env:
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          install -d -m 700 "$DOCKER_CONFIG"
          printf '%s' "$REGISTRY_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
      - name: Install deployment files and deploy verified images
        run: |
          install -m 644 docker-compose.aws-lean.yml /opt/aidlink/docker-compose.aws-lean.yml
          install -D -m 644 infra/caddy/Caddyfile.aws /opt/aidlink/infra/caddy/Caddyfile.aws
          install -D -m 700 infra/aws/deploy.sh /opt/aidlink/infra/aws/deploy.sh
          backend=$(cat "$RUNNER_TEMP/aidlink-images/backend.image")
          frontend=$(cat "$RUNNER_TEMP/aidlink-images/frontend.image")
          bash /opt/aidlink/infra/aws/deploy.sh "$backend" "$frontend"
      - name: Update optional lightweight monitoring
        run: |
          install -m 644 docker-compose.aws-monitoring.yml /opt/aidlink/docker-compose.aws-monitoring.yml
          install -d /opt/aidlink/infra/monitoring/aws
          cp -R infra/monitoring/aws/. /opt/aidlink/infra/monitoring/aws/
          install -D -m 700 infra/aws/deploy-monitoring.sh /opt/aidlink/infra/aws/deploy-monitoring.sh
          bash /opt/aidlink/infra/aws/deploy-monitoring.sh
      - name: Remove temporary registry login
        if: always()
        run: |
          docker logout ghcr.io || true
          rm -f "$DOCKER_CONFIG/config.json"
