global:
  scrape_interval: 60s
  evaluation_interval: 60s
scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["prometheus:9090"]
  - job_name: aidlink-backend
    metrics_path: /actuator/prometheus
    scrape_timeout: 10s
    sample_limit: 10000
    static_configs:
      - targets: ["backend:8080"]
