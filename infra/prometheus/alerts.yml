groups:
  - name: aidlink
    rules:
      - alert: AidLinkBackendDown
        expr: up{job="aidlink-backend"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "AIDLINK 백엔드 메트릭 엔드포인트가 응답하지 않습니다."

      - alert: AidLinkHigh5xxRate
        expr: |
          sum(rate(http_server_requests_seconds_count{status=~"5.."}[5m]))
          / clamp_min(sum(rate(http_server_requests_seconds_count[5m])), 1e-9) > 0.05
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "AIDLINK 5xx 비율이 5%를 초과했습니다."

      - alert: AidLinkAiFailureRateHigh
        expr: |
          sum(rate(ai_request_total{outcome="failure"}[15m]))
          / clamp_min(sum(rate(ai_request_total[15m])), 1e-9) > 0.20
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "AI Rule Parsing 실패율이 20%를 초과했습니다."

      - alert: AidLinkBatchFailed
        expr: increase(batch_execution_total{outcome="failure"}[15m]) > 0
        labels:
          severity: critical
        annotations:
          summary: "정책 동기화 Batch가 실패했습니다."

      - alert: AidLinkUnknownRateHigh
        expr: |
          sum(rate(eligibility_unknown_total[30m]))
          / clamp_min(sum(rate(eligibility_evaluation_total[30m])), 1e-9) > 0.50
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "자격 분석 UNKNOWN 비율이 50%를 초과했습니다."

      - alert: AidLinkDbPoolNearCapacity
        expr: hikaricp_connections_active / clamp_min(hikaricp_connections_max, 1) > 0.90
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "DB Connection Pool 사용률이 90%를 초과했습니다."

      - alert: AidLinkGov24ApiRepeatedFailure
        expr: government_api_consecutive_failures{source="GOV24"} >= 3
        labels:
          severity: critical
        annotations:
          summary: "정부24 API 요청이 연속 3회 이상 실패했습니다."
